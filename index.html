<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BXL Trade</title>
  <style>
    :root { --accent:#ffb000; --bg:#090b10; --panel:#11151d; --text:#f7f8fa; --green:#00c087; --red:#ef5350; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Inter,system-ui,sans-serif; }
    .app { max-width:760px; min-height:100vh; margin:auto; padding:12px; }
    header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
    .brand { font-weight:900; letter-spacing:.5px; }
    .brand span { color:var(--accent); }
    .pill { background:var(--panel); border:1px solid #252a34; border-radius:20px; padding:7px 10px; font-size:12px; }
    .pair { display:flex; justify-content:space-between; align-items:flex-end; margin:4px 0 8px; }
    .symbol { font-size:20px; font-weight:800; }
    .price { color:var(--green); font-size:24px; font-weight:800; }
    .chart-wrap { position:relative; height:430px; background:var(--panel); border:1px solid #252a34; border-radius:10px; overflow:hidden; }
    canvas { width:100%; height:100%; display:block; }
    .toolbar { position:absolute; z-index:2; top:8px; left:8px; display:flex; gap:6px; }
    .tool { border:1px solid #343b48; background:#151a23e6; color:white; height:32px; min-width:32px; border-radius:7px; cursor:pointer; }
    .tool:focus-visible, .swatch:focus-visible, .modal-actions button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .result { position:absolute; z-index:3; left:50%; top:55%; transform:translate(-50%,-50%) scale(.8); opacity:0; pointer-events:none; text-align:center; padding:12px 18px; border-radius:10px; background:#090b10dd; transition:opacity .2s,transform .2s; }
    .result.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
    .result.win { color:var(--green); }
    .result.loss { color:var(--red); }
    .result b { display:block; font-size:24px; }
    .trade { position:relative; display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
    .trade button { height:58px; border:0; border-radius:9px; color:white; font-weight:900; font-size:17px; cursor:pointer; }
    #buy { background:var(--green); }
    #sell { background:var(--red); }
    .trade button:disabled { opacity:.55; cursor:not-allowed; }
    .timer { grid-column:1/-1; height:42px; display:flex; align-items:center; justify-content:center; border:1px solid #343b48; border-radius:9px; background:var(--panel); font-weight:800; }
    .timer span { color:var(--accent); font-size:20px; margin-left:7px; }
    .modal { position:fixed; inset:0; z-index:10; display:none; place-items:center; background:#0009; padding:20px; }
    .modal.open { display:grid; }
    .modal-card { width:min(380px,100%); background:var(--panel); border:1px solid #343b48; border-radius:12px; padding:16px; }
    .modal-card h3 { margin:0; }
    .colors { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:12px 0 16px; }
    .swatch { height:38px; border:2px solid transparent; border-radius:7px; cursor:pointer; }
    .swatch.selected { border-color:white; box-shadow:0 0 0 2px var(--accent); }
    .modal-actions { display:flex; gap:8px; }
    .modal-actions button { flex:1; height:40px; border-radius:7px; border:1px solid #343b48; background:#1b2029; color:white; cursor:pointer; }
    @media (max-width:520px) { .app { padding:8px; } .chart-wrap { height:52vh; min-height:380px; } }
  </style>
</head>
<body>
  <main class="app">
    <header><div class="brand">BXL <span>TRADE</span></div><div class="pill">DEMO • 10,000 THB</div></header>
    <section class="pair"><div><div class="pill" style="display:inline-block">BTC / USD</div><div class="symbol">Bitcoin</div></div><div class="price" id="price">68,420.50</div></section>
    <section class="chart-wrap">
      <div class="toolbar">
        <button class="tool" id="zoomOut" type="button" title="ซูมออก" aria-label="ซูมออก">−</button>
        <button class="tool" id="zoomIn" type="button" title="ซูมเข้า" aria-label="ซูมเข้า">＋</button>
        <button class="tool" id="colorBtn" type="button" title="เปลี่ยนสีกราฟ" aria-label="เปลี่ยนสีกราฟ">🎨</button>
      </div>
      <canvas id="chart" aria-label="กราฟราคา Bitcoin"></canvas>
      <div class="result" id="result" aria-live="polite"><span id="resultTitle">WIN</span><b id="resultValue">+$82.40</b></div>
    </section>
    <section class="trade">
      <button id="buy" type="button">BUY</button><button id="sell" type="button">SELL</button>
      <div class="timer" id="timer">เวลาการเทรด <span id="countdown">—</span></div>
    </section>
  </main>
  <div class="modal" id="colorModal" role="dialog" aria-modal="true" aria-labelledby="colorHeading">
    <div class="modal-card">
      <h3 id="colorHeading">สีกราฟ</h3>
      <div class="colors" aria-label="เลือกสีกราฟ">
        <button class="swatch" type="button" aria-label="สีเขียว" data-color="#00c087" style="background:#00c087"></button>
        <button class="swatch" type="button" aria-label="สีฟ้า" data-color="#29b6f6" style="background:#29b6f6"></button>
        <button class="swatch" type="button" aria-label="สีม่วง" data-color="#ab47bc" style="background:#ab47bc"></button>
        <button class="swatch" type="button" aria-label="สีส้ม" data-color="#ff9800" style="background:#ff9800"></button>
        <button class="swatch" type="button" aria-label="สีชมพู" data-color="#ec407a" style="background:#ec407a"></button>
        <button class="swatch" type="button" aria-label="สีเหลือง" data-color="#fdd835" style="background:#fdd835"></button>
        <button class="swatch" type="button" aria-label="สีแดง" data-color="#ef5350" style="background:#ef5350"></button>
        <button class="swatch" type="button" aria-label="สีฟ้าอ่อน" data-color="#26c6da" style="background:#26c6da"></button>
        <button class="swatch" type="button" aria-label="สีขาว" data-color="#f5f5f5" style="background:#f5f5f5"></button>
        <button class="swatch" type="button" aria-label="สีทอง" data-color="#ffb000" style="background:#ffb000"></button>
      </div>
      <div class="modal-actions"><button id="closeModal" type="button">ปิด</button></div>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('chart');
    const ctx = canvas.getContext('2d');
    const priceElement = document.getElementById('price');
    const countdownElement = document.getElementById('countdown');
    const colorModal = document.getElementById('colorModal');
    const swatches = [...document.querySelectorAll('.swatch')];
    let candles = [];
    let zoom = 1;
    let chartColor = '#00c087';
    let last = 68420.5;
    let trade = null;
    let tradeTimer = null;
    let drawQueued = false;

    for (let i = 0; i < 70; i++) {
      const open = last + (Math.random() - 0.5) * 180;
      const close = open + (Math.random() - 0.5) * 220;
      candles.push({ o:open, c:close, h:Math.max(open, close) + Math.random() * 100, l:Math.min(open, close) - Math.random() * 100 });
      last = close;
    }

    function requestDraw() {
      if (drawQueued) return;
      drawQueued = true;
      requestAnimationFrame(() => {
        drawQueued = false;
        draw();
      });
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const pixelWidth = Math.round(rect.width * dpr);
      const pixelHeight = Math.round(rect.height * dpr);
      if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
        canvas.width = pixelWidth;
        canvas.height = pixelHeight;
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      requestDraw();
    }

    function draw() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      if (!width || !height || !candles.length) return;

      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = '#11151d';
      ctx.fillRect(0, 0, width, height);

      const pad = { top:48, right:14, bottom:22, left:14 };
      const chartHeight = height - pad.top - pad.bottom;
      const visibleCount = Math.min(candles.length, Math.max(12, Math.floor(70 * zoom)));
      const visible = candles.slice(-visibleCount);
      let low = Infinity;
      let high = -Infinity;
      for (const candle of visible) {
        if (candle.l < low) low = candle.l;
        if (candle.h > high) high = candle.h;
      }
      const range = Math.max(high - low, 1);
      low -= range * 0.08;
      high += range * 0.08;
      const valueRange = high - low;
      const yFor = value => pad.top + (high - value) / valueRange * chartHeight;

      ctx.strokeStyle = '#232936';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 5; i++) {
        const y = pad.top + chartHeight * i / 5;
        ctx.beginPath();
        ctx.moveTo(0, Math.round(y) + 0.5);
        ctx.lineTo(width, Math.round(y) + 0.5);
        ctx.stroke();
      }

      const slotWidth = (width - pad.left - pad.right) / visible.length;
      const bodyWidth = Math.max(2, Math.min(12, slotWidth * 0.62));
      ctx.strokeStyle = chartColor;
      ctx.fillStyle = chartColor;
      ctx.lineWidth = 1.5;
      for (let i = 0; i < visible.length; i++) {
        const candle = visible[i];
        const x = pad.left + slotWidth * (i + 0.5);
        ctx.beginPath();
        ctx.moveTo(x, yFor(candle.h));
        ctx.lineTo(x, yFor(candle.l));
        ctx.stroke();
        const top = yFor(Math.max(candle.o, candle.c));
        const bottom = yFor(Math.min(candle.o, candle.c));
        ctx.fillRect(x - bodyWidth / 2, top, bodyWidth, Math.max(1, bottom - top));
      }

      const currentY = yFor(last);
      ctx.save();
      ctx.setLineDash([4, 4]);
      ctx.globalAlpha = 0.7;
      ctx.beginPath();
      ctx.moveTo(0, currentY);
      ctx.lineTo(width, currentY);
      ctx.stroke();
      ctx.restore();
    }

    function tick() {
      const open = last + (Math.random() - 0.5) * 90;
      const close = open + (Math.random() - 0.5) * 100;
      candles.push({ o:open, c:close, h:Math.max(open, close) + Math.random() * 55, l:Math.min(open, close) - Math.random() * 55 });
      if (candles.length > 120) candles.shift();
      last = close;
      priceElement.textContent = last.toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });
      requestDraw();
    }

    function openColorModal() {
      colorModal.classList.add('open');
    }

    function closeColorModal() {
      colorModal.classList.remove('open');
    }

    function startTrade(side) {
      if (trade) return;
      trade = { side, entry:last };
      let remaining = 10;
      document.getElementById('buy').disabled = true;
      document.getElementById('sell').disabled = true;
      countdownElement.textContent = `${remaining}s`;
      tradeTimer = setInterval(() => {
        remaining -= 1;
        countdownElement.textContent = remaining > 0 ? `${remaining}s` : '0s';
        if (remaining <= 0) finishTrade();
      }, 1000);
    }

    function finishTrade() {
      if (!trade) return;
      clearInterval(tradeTimer);
      tradeTimer = null;
      const profit = (last - trade.entry) * (trade.side === 'BUY' ? 1 : -1);
      const won = profit >= 0;
      const result = document.getElementById('result');
      document.getElementById('resultTitle').textContent = won ? 'WIN' : 'LOSS';
      document.getElementById('resultValue').textContent = `${profit >= 0 ? '+' : '-'}$${Math.abs(profit).toFixed(2)}`;
      result.className = `result show ${won ? 'win' : 'loss'}`;
      document.getElementById('buy').disabled = false;
      document.getElementById('sell').disabled = false;
      countdownElement.textContent = '—';
      trade = null;
      setTimeout(() => result.classList.remove('show'), 2500);
    }

    document.getElementById('zoomIn').addEventListener('click', () => { zoom = Math.min(3, zoom * 1.25); requestDraw(); });
    document.getElementById('zoomOut').addEventListener('click', () => { zoom = Math.max(1, zoom / 1.25); requestDraw(); });
    document.getElementById('colorBtn').addEventListener('click', openColorModal);
    document.getElementById('closeModal').addEventListener('click', closeColorModal);
    colorModal.addEventListener('click', event => { if (event.target === colorModal) closeColorModal(); });
    document.addEventListener('keydown', event => { if (event.key === 'Escape') closeColorModal(); });
    swatches.forEach(button => button.addEventListener('click', () => {
      chartColor = button.dataset.color;
      swatches.forEach(swatch => swatch.classList.toggle('selected', swatch === button));
      closeColorModal();
      requestDraw();
    }));
    document.getElementById('buy').addEventListener('click', () => startTrade('BUY'));
    document.getElementById('sell').addEventListener('click', () => startTrade('SELL'));

    if ('ResizeObserver' in window) new ResizeObserver(resizeCanvas).observe(canvas);
    else window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    setInterval(tick, 900);
  </script>
</body>
</html>
